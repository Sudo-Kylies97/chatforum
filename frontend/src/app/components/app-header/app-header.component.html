<header><a class="brand" href="/" aria-label="Verity Forum home"><span class="logo">V</span><span>Verity<small>Forum</small></span></a>@if(user()){<div class="session"><span>Signed in as <b>{{user()!.username}}</b></span><button class="quiet" (click)="logout.emit()">Log out</button></div>}@else{<form class="login" (ngSubmit)="submit()"><input name="username" [(ngModel)]="username" placeholder="Username" aria-label="Username" autocomplete="username" required><input name="password" [(ngModel)]="password" placeholder="Password" aria-label="Password" type="password" autocomplete="current-password" required><button>Log in</button></form>}</header>
